name: Python checks
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q main.py backend scripts
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test SQLite persistence
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []
                  self.current = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.active = True
                      self.current = []

              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.active:
                      self.parts.append("".join(self.current))
                      self.active = False

          parser = Scripts()
          parser.feed(Path("frontend/index.html").read_text(encoding="utf-8"))
          Path("/tmp/nexuscore-inline.js").write_text("\n;".join(parser.parts), encoding="utf-8")
          PY
          node --check /tmp/nexuscore-inline.js
