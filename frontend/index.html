<!DOCTYPE html><html lang="pt-BR"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NEXUS CORE</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#0f1115;color:#e8eaf0}header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#15181f}.btn{background:#2a6cff;color:#fff;border:0;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}nav{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap}nav button{padding:9px 12px;border-radius:999px;border:1px solid #2b3140;background:#15181f;color:#dbe0ea;cursor:pointer}nav button.active{background:#fff;color:#111}main{padding:14px 18px 100px;max-width:1000px;margin:0 auto}.card{background:#171a22;border:1px solid #232733;border-radius:14px;padding:16px;margin-top:14px}.chat{height:380px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-top:10px}.msg{max-width:92%;padding:11px 13px;border-radius:14px;line-height:1.6;font-size:15px;white-space:pre-wrap;word-break:break-word}.msg.user{background:#2a6cff;align-self:flex-end}.msg.ai{background:#1e232e;align-self:flex-start}.msg small{display:block;color:#9aa0ad;margin-top:6px;font-size:12px}.row{display:flex;gap:8px;margin-top:12px}input,textarea{flex:1;background:#10131a;border:1px solid #2b3140;color:#fff;padding:12px;border-radius:12px;outline:none}.hidden{display:none}img.gerada{width:100%;border-radius:12px;margin-top:10px}pre{background:#0a0c10;padding:12px;border-radius:10px;overflow:auto;font-size:13px}</style>
</head><body>
<header><div><b>NEXUS CORE</b></div><button class="btn" onclick="testar()">Testar</button></header>
<div class="card" id="status-card">Status: <span id="status-texto">Testando...</span><br><small id="status-detalhe"></small></div>
<nav><button class="active" onclick="irPara('geral',this)">Chat do Time</button><button onclick="irPara('diretoria',this)">Diretoria</button><button onclick="irPara('programacao',this)">Programacao</button><button onclick="irPara('publicidade',this)">Publicidade</button><button onclick="irPara('projeto',this)">Projeto</button><button onclick="irPara('ideias',this)">Banco de Ideias</button><button onclick="irPara('email',this)">E-mail</button></nav>
<main>
<section id="geral"><div class="card"><h3>Chat do Time</h3><div class="chat" id="chat-geral"><div class="msg ai">Olá! Pode falar de qualquer tema.</div></div><div class="row"><input id="texto-geral" placeholder="Fale qualquer coisa..."><button class="btn" onclick="enviar('geral')">Enviar</button></div></div></section>
<section id="diretoria" class="hidden"><div class="card"><h3>Diretoria</h3><div class="chat" id="chat-diretoria"><div class="msg ai">Olá.</div></div><div class="row"><input id="texto-diretoria" placeholder="Fale..."><button class="btn" onclick="enviar('diretoria')">Enviar</button></div></div></section>
<section id="programacao" class="hidden"><div class="card"><h3>Programação</h3><div class="chat" id="chat-programacao"><div class="msg ai">Olá.</div></div><div class="row"><input id="texto-programacao" placeholder="Peça um código..."><button class="btn" onclick="enviar('programacao')">Enviar</button></div></div></section>
<section id="publicidade" class="hidden"><div class="card"><h3>Publicidade</h3><div class="chat" id="chat-publicidade"><div class="msg ai">Olá.</div></div><div class="row"><input id="texto-publicidade" placeholder="Peça campanha..."><button class="btn" onclick="enviar('publicidade')">Enviar</button></div></div></section>
<section id="projeto" class="hidden"><div class="card"><h3>Projeto</h3><p>Código e imagem aparecem nos chats.</p></div></section>
<section id="ideias" class="hidden"><div class="card"><h3>Banco de Ideias</h3><div id="lista-ideias">Carregando...</div></div></section>
<section id="email" class="hidden"><div class="card"><h3>E-mail</h3><div class="row"><textarea id="email-texto" placeholder="Escreva sua ideia"></textarea></div><button class="btn" onclick="enviarEmail()">Enviar</button><p id="email-status"></p></div></section>
</main>
<script>
function irPara(id,btn){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(btn){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}if(id==='ideias') carregarIdeias();}
async function carregarIdeias(){const box=document.getElementById('lista-ideias');box.innerText='Carregando...';try{const r=await fetch('/api/ideias');const d=await r.json();const items=d.items||[];box.innerHTML=items.length?items.map(x=>'<article class="card"><b>'+String(x.title).replace(/</g,'&lt;')+'</b><p>'+String(x.summary).replace(/</g,'&lt;')+'</p><small>Prioridade: '+x.priority+' | '+x.created_at+'</small></article>').join(''):'Ainda não há ideias salvas.';}catch(e){box.innerText='Não foi possível carregar as ideias.';}}\nfunction formatar(t){let x=t.replace(/</g,'&lt;').replace(/>/g,'&gt;');x=x.replace(/\[IMAGEM\](.*?)\[\/IMAGEM\]/g,'<br><img class="gerada" src="$1"><br><a href="$1" target="_blank" style="color:#7dd3a8">Abrir em alta resolução</a>');x=x.replace(/```(\w*)\n([\s\S]*?)```/g,function(m,l,c){const id='c'+Math.random().toString(36).slice(2);return '<pre id="'+id+'">'+c+'</pre><button class="btn" onclick="copiar(\''+id+'\')">Copiar código</button>';});return x;}
function copiar(id){const el=document.getElementById(id);navigator.clipboard.writeText(el.innerText).then(()=>alert('Copiado!'));}
async function testar(){try{const r=await fetch('/api/saude');const j=await r.json();document.getElementById('status-texto').innerText=r.ok?'Online':'Indisponível';document.getElementById('status-detalhe').innerText='Versão '+(j.versao||'-')+' | Gemini: '+(j.provedores_configurados?.gemini?'configurado':'não configurado')+' | Groq: '+(j.provedores_configurados?.groq?'configurado':'não configurado')+' | Banco: '+(j.banco||'verificando');}catch(e){document.getElementById('status-texto').innerText='Sem conexão com a API';document.getElementById('status-detalhe').innerText='Verifique se o serviço terminou de iniciar.';}}
async function enviar(tipo){const inp=document.getElementById('texto-'+tipo);if(!inp.value.trim())return;const chat=document.getElementById('chat-'+tipo);const texto=inp.value.trim();inp.value='';chat.innerHTML+='<div class="msg user">'+texto.replace(/</g,'&lt;')+'</div>';const id='p'+Date.now();chat.innerHTML+='<div class="msg ai" id="'+id+'">Pensando...</div>';chat.scrollTop=chat.scrollHeight;try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:texto,tipo:tipo})});const bruto=await res.text();let d=null;try{d=JSON.parse(bruto);}catch(e){d=null;}const el=document.getElementById(id);if(!d){el.innerHTML='Erro controlado. Cola o main super e faz deploy.';return;}el.innerHTML='<b>Resposta:</b><br>'+formatar(d.resposta||'')+'<small>'+(d.cerebro||'')+' | '+(d.origem||'')+'</small>';}catch(e){document.getElementById(id).innerHTML='Sem ligação. Espera 50s.';}chat.scrollTop=chat.scrollHeight;}
async function enviarEmail(){const t=document.getElementById('email-texto');if(!t.value){alert('Escreve a ideia.');return;}const r=await fetch('/api/email/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:t.value})});const d=await r.json();document.getElementById('email-status').innerText=d.mensagem||'Enviado';t.value='';}
testar();
document.querySelectorAll('input').forEach(i=>{i.addEventListener('keydown',e=>{if(e.key==='Enter'){const id=i.id.replace('texto-','');if(id) enviar(id);}})});
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
