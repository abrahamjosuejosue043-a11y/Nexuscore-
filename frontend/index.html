<!-- Atualize a linha dos botões de teste dentro do modal para: -->
<div class="testes">
  <button onclick="NEXUS.falar('FORJA','Teste de áudio concluído. Forja operacional, Senhor Josué.')">TESTAR FORJA</button>
  <button onclick="NEXUS.falar('LIA','Teste de áudio concluído. Lia pronta para divulgar, Senhor Josué.')">TESTAR LIA</button>
  <button onclick="NEXUS.falar('ORION','Teste de áudio concluído. Orion no comando, Senhor Josué.')">TESTAR ORION</button>
</div>

<!-- E substitua o bloco <script> do CEREBRO EMBUTIDO por este: -->
<script>
(function(){
  const N = {
    modo: "SOLO",
    quem: "ORION",
    micLigado: false,
    rec: null,
    audio: null,
    pararPalavras: ["para", "pare", "parar", "silencio", "silêncio", "quieto", "calma", "espera", "chega"],

    ligarMic: function() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert("Use o navegador Google Chrome no celular para ativar o microfone.");
        return;
      }
      if (this.micLigado) return;
      this.rec = new SR();
      this.rec.lang = "pt-BR";
      this.rec.continuous = true;
      this.rec.interimResults = false;

      this.rec.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) {
            const textoOuvido = e.results[i][0].transcript.trim();
            if (textoOuvido) this.ouvir(textoOuvido);
          }
        }
      };

      this.rec.onend = () => {
        if (this.micLigado) {
          try { this.rec.start(); } catch (_) {}
        }
      };

      this.rec.start();
      this.micLigado = true;
      const b = document.querySelector(".mic");
      if (b) b.innerHTML = "● MIC OUVINDO";
      this.falar("ORION", "Microfone ativo, Senhor Josué. Fale Vamos Iniciar Reunião ou faça sua pergunta.");
    },

    desligarMic: function() {
      this.micLigado = false;
      if (this.rec) { try { this.rec.stop(); } catch (_) {} }
      const b = document.querySelector(".mic");
      if (b) b.innerHTML = "ATIVAR MICROFONE";
    },

    ouvir: function(fala) {
      const t = fala.toLowerCase();
      this.mostrar("SENHOR JOSUÉ", fala, true);

      for (let p of this.pararPalavras) {
        if (t === p || t.startsWith(p + " ")) {
          this.pararAgora();
          return;
        }
      }

      if (t.includes("vamos iniciar reuniao") || t.includes("vamos iniciar reunião") || t.includes("iniciar reuniao")) {
        this.falar("ORION", "Bem-vindo Senhor Josué. Todos os servidores estão online e prontos para o trabalho.");
        setTimeout(() => this.falar("FORJA", "Forja pronta, Senhor Josué. Código, sistemas e laboratório à disposição."), 3500);
        setTimeout(() => this.falar("LIA", "Lia pronta, Senhor Josué. Estratégia e comunicação ativadas."), 7000);
        return;
      }

      if (t.includes("forja")) this.quem = "FORJA";
      else if (t.includes("lia")) this.quem = "LIA";
      else if (t.includes("orion")) this.quem = "ORION";

      this.perguntarIA(this.quem, fala);
    },

    pararAgora: function() {
      if (this.audio) { try { this.audio.pause(); } catch (_) {} this.audio = null; }
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      this.falarLocal("ORION", "Áudio interrompido. Estou ouvindo, Senhor Josué.");
    },

    falar: function(quem, texto, motorTag) {
      this.mostrar(quem, texto, false, motorTag);
      fetch("/api/voice", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ quem: quem, texto: texto })
      })
      .then(r => {
        if (!r.ok) throw new Error("Fallback voz local");
        return r.blob();
      })
      .then(blob => {
        if (this.audio) { try { this.audio.pause(); } catch (_) {} }
        this.audio = new Audio(URL.createObjectURL(blob));
        this.audio.play();
      })
      .catch(() => this.falarLocal(quem, texto, true));
    },

    falarLocal: function(quem, texto, jaMostrou) {
      if (!jaMostrou) this.mostrar(quem, texto, false, "VOZ-LOCAL");
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = "pt-BR";
      u.rate = 1.05;
      u.pitch = quem === "LIA" ? 1.1 : (quem === "FORJA" ? 0.9 : 0.8);
      window.speechSynthesis.speak(u);
    },

    perguntarIA: function(quem, pergunta) {
      fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ quem: quem, modo: this.modo, pergunta: pergunta })
      })
      .then(r => r.json())
      .then(d => {
        const resp = d.resposta || "Entendi, Senhor Josué.";
        this.falar(d.quem || quem, resp, d.motor);
      })
      .catch(() => this.falar(quem, "Não consegui alcançar o servidor agora, Senhor Josué.", "ERRO-REDE"));
    },

    mostrar: function(quem, texto, isUser, motorTag) {
      let box = document.getElementById("nexus-chat");
      if (!box) {
        box = document.createElement("div");
        box.id = "nexus-chat";
        box.style.cssText = "margin-top:16px;display:flex;flex-direction:column;gap:10px";
        const room = document.getElementById("tela-room");
        if (room) room.appendChild(box);
      }
      const div = document.createElement("div");
      const corBorda = isUser ? "rgba(167,139,250,.35)" : "rgba(34,211,238,.25)";
      const corNome = isUser ? "#a78bfa" : "#22d3ee";
      const badge = motorTag ? ` <span style="opacity:.6;font-size:9px">[${motorTag}]</span>` : "";
      div.style.cssText = `background:rgba(255,255,255,.06);border:1px solid ${corBorda};border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.5`;
      div.innerHTML = `<b style="color:${corNome};font-size:11px;letter-spacing:.15em">${quem}${badge}</b><br>${texto}`;
      box.appendChild(div);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }
  };

  window.NEXUS = N;

  document.addEventListener("DOMContentLoaded", () => {
    const mic = document.querySelector(".mic");
    if (mic) {
      mic.textContent = "ATIVAR MICROFONE";
      mic.onclick = () => N.micLigado ? N.desligarMic() : N.ligarMic();
    }

    document.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        const txt = btn.innerText || "";
        if (txt.includes("COLETIVA")) {
          N.modo = "COLETIVA";
          N.falar("ORION", "Modo coletiva ativado, Senhor Josué. Forja, Lia e eu estamos na escuta.");
        } else if (txt.includes("FORJA")) {
          N.modo = "SOLO"; N.quem = "FORJA";
          N.falar("FORJA", "Forja na linha, Senhor Josué. Qual sistema vamos construir?");
        } else if (txt.includes("LIA")) {
          N.modo = "SOLO"; N.quem = "LIA";
          N.falar("LIA", "Lia na linha, Senhor Josué. Qual campanha vamos lançar?");
        } else if (txt.includes("ORION")) {
          N.modo = "SOLO"; N.quem = "ORION";
          N.falar("ORION", "Orion na linha, Senhor Josué. Qual a diretriz?");
        }
      });
    });
  });
})();
</script>
