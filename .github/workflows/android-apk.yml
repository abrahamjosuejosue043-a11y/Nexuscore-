name: Build Nexuscore Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare current web interface for APK
        run: cp frontend/index.html www/index.html
      - name: Install Capacitor and speech plugin
        run: npm install
      - name: Bundle native speech bridge into local app
        run: |
          npm run build:mobile
          python - <<'PY'
          from pathlib import Path
          path = Path("www/index.html")
          html = path.read_text()
          html = html.replace("</body>", '<script src="/nexuscore-speech.js"></script>\\n</body>')
          path.write_text(html)
          PY
      - name: Generate Android project
        run: npx cap add android
      - name: Add Android media and microphone permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = """    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          """
          if "android.permission.RECORD_AUDIO" not in content:
              content = content.replace("    <application", permissions + "    <application", 1)
              manifest.write_text(content)
          PY
      - name: Apply Nexuscore launcher icon
        run: |
          pip install pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path
          import math
          root = Path("android/app/src/main/res")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder,size in sizes.items():
              d=root/folder
              d.mkdir(parents=True,exist_ok=True)
              im=Image.new("RGB",(size,size),(8,20,40))
              px=im.load()
              for y in range(size):
                  for x in range(size):
                      t=(x+y)/(2*size)
                      px[x,y]=(int(25+24*t),int(115-50*t),int(180+45*t))
              mask=Image.new("L",(size,size),0)
              md=ImageDraw.Draw(mask)
              md.rounded_rectangle((size*.04,size*.04,size*.96,size*.96),radius=size*.25,fill=255)
              im.putalpha(mask)
              dr=ImageDraw.Draw(im)
              w=max(2,int(size*.11))
              dr.line([(size*.27,size*.73),(size*.27,size*.27),(size*.73,size*.73),(size*.73,size*.27)],fill="white",width=w,joint="curve")
              dr.ellipse((size*.68,size*.14,size*.82,size*.28),fill=(190,255,244,255))
              im.save(d/"ic_launcher.png")
              im.save(d/"ic_launcher_round.png")
          PY
      - name: Build debug APK
        run: |
          for attempt in 1 2 3 4; do
            echo "Gradle build attempt ${attempt}/4"
            if (cd android && ./gradlew assembleDebug --no-daemon --max-workers=2); then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Dependency server temporarily unavailable; retrying in 25 seconds."
              sleep 25
            fi
          done
          exit 1
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexuscore-ai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexuscore-android-${{ github.run_number }}
          name: Nexuscore AI — APK mais recente
          body: APK Android gerado automaticamente para o Nexuscore AI. A aplicação conecta-se ao serviço online.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
